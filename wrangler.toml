name = "loopmachine"
main = "src/worker.ts"
compatibility_date = "2026-07-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "bfcb6ac5b3ceaf42a09607f6f7925823"

[assets]
directory = "./site/public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[[durable_objects.bindings]]
name = "LOOPUP_RUN"
class_name = "LoopupRun"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoopupRun"]

[[routes]]
pattern = "loopmachine.coey.dev"
custom_domain = true